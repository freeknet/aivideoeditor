name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow on the tagged commit before it
  # publishes. `ref` is that commit's SHA; every checkout below takes it,
  # and on any other event it is empty, which checks out the event's own
  # commit as before.
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to check out and test"
        required: true
        type: string

# A second push to the same branch makes the first run's result irrelevant.
# A release's run is keyed by its commit instead: called from release.yml,
# `github.ref` is the caller's, and a dispatched release shares it with
# main's pushes, which would cancel the release's tests (or be cancelled
# by them).
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Least privilege by default: nothing in this workflow writes to the
# repository, so the token it runs with can only read it. A job that needs
# more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation helps a developer's next edit, never a fresh
  # runner: it only makes the cache bigger and slower to save and restore.
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    # Every job has a timeout, well above its slowest cold-cache run, so a
    # hung test fails in minutes rather than holding a runner for GitHub's
    # default six hours.
    timeout-minutes: 10
    steps:
      # Pinned to full SHAs: a mutable tag in a workflow is a supply-chain
      # risk the moment the workflow holds a write-capable token. Update
      # deliberately, with a diff of the new SHA, not silently on the next
      # run. The versions are in the trailing comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The version matches rust-toolchain.toml, so CI and a local checkout
      # run the same rustfmt and the same clippy. `@stable` would mean CI
      # silently moving to each new release on its own.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The dependency surface does not vary by runner (`deny.toml` names the
    # targets it resolves for), so one run suffices. Reads only: the action
    # downloads the advisory database and scans the lockfile.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features --locked

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 60
    # The authoritative job: Windows is the platform the app ships for, and
    # this is the only runner that links and runs the whole of it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # fetch-depth: 0 for the changelog check below, which reads
          # `git tag` and walks the whole history. The default checkout is
          # shallow and fetches no tags at all, so every release would come
          # back missing and the check would fail for a reason that has
          # nothing to do with the changelog.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.99.1"
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows

      # `--all-targets` covers the examples and tests too, so nothing that
      # only `cargo run --example` would build can rot silently.
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      # CHANGELOG.md is generated from the git history by
      # examples/changelog.rs, so a released section that disagrees with
      # the tags is a mistake, not a style choice. Released sections only:
      # `Unreleased` moves with every merge and a squash rewrites the very
      # hashes it pins, so gating pull requests on it would fail all of
      # them for no signal.
      - name: Changelog
        run: cargo run --locked --example changelog -- --check

      # THIRD_PARTY.md is generated from Cargo.lock and the history by
      # examples/credits.rs; a dependency bump that did not regenerate it
      # fails here rather than shipping a stale list. It reads the whole
      # history for the contributors, hence this job's full checkout.
      - name: Credits
        run: cargo run --locked --example credits -- --check

      # Release is where `panic = "abort"`, LTO and one codegen unit apply.
      # Those change what compiles: a `catch_unwind` that builds in debug
      # does not build under `panic = "abort"`, and this is the step that
      # says so before a tag does.
      - name: Build release binaries
        run: cargo build --release --locked --bins

      # The zip a release would ship, built by the same example the release
      # workflow runs, so a missing file or a broken notice fails a pull
      # request instead of a tag.
      - name: Package
        run: cargo run --locked --example package -- package --out dist

      # That exact zip, unpacked outside the checkout: the file list, the
      # notices, the version resource, the imports (no C runtime DLL), the
      # symbols, and `ave --version` and `ave --diagnose` run from the
      # unpacked folder.
      - name: Check the package
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version *=/{gsub(/[" ]/, "", $0); sub(/^version=/, "", $0); print; exit}' Cargo.toml)
          name="dist/aivideoeditor-v${version}-dev-x86_64-pc-windows-msvc"
          cargo run --locked --example package -- check "${name}.zip" --symbols "${name}-symbols.zip"

  linux:
    name: linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Not redundant with the Windows job: it is the fastest signal on the
    # board, and the cross-check below type-checks the Windows-only code
    # without linking anything, so a Linux push fails fast on a
    # Windows-only mistake.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.99.1"
          components: clippy
          # The Windows std, for the cross-check below. Adding the target
          # costs a download; it does not install a linker, and does not
          # need to.
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux

      # cpal (the viewer's audio) links ALSA on Linux; its build script
      # fails without the headers. native-tls (the assistant's HTTPS) links
      # OpenSSL on Linux. DejaVu gives the GUI tests their symbol fallback
      # (egui_kittest panics on a glyph no font has).
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libssl-dev pkg-config fonts-dejavu-core fonts-noto-core

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      # `clippy --target x86_64-pc-windows-msvc` type-checks the Win32 layer
      # without linking, so a broken `unsafe extern` block or an egui API
      # that moved fails here in a minute. The Windows job above is still
      # the authority; this one just fails first, and cheaply.
      - name: Cross-check the Windows build
        run: cargo clippy --locked --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
