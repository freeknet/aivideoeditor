name: Scheduled

# Checks that can go red without a push, and the periodic ones that report
# rather than gate. A new RustSec advisory breaks nothing in ci.yml until
# the next commit happens to trip it; an unused dependency or an untested
# branch never does. These run weekly and on demand, and on a pull request
# that changes this workflow.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/scheduled.yml

permissions:
  contents: read

concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  advisories:
    name: cargo-deny (new advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ci.yml runs the same check on every push; this is the one that runs
    # when nothing was pushed and an advisory was published anyway.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
          arguments: --all-features --locked

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A dependency the crate declares and no longer uses still builds, and
    # cargo-deny audits it for nothing. cargo-machete reads the sources, so
    # it can be wrong about one used only by a macro or a build script;
    # name those in `[package.metadata.cargo-machete] ignored` in
    # Cargo.toml, with the reason beside it. Nothing is removed without a
    # build that proves it unused.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  coverage:
    name: coverage (the library's tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Line coverage of the library's unit tests on Linux: the engine, the
    # plan check, the parsers and the GUI's headless tests. A report to
    # find missing cases, not a gate and not a percentage to chase.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.99.1"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
      # The same system libraries as ci.yml's Linux job: ALSA for cpal,
      # OpenSSL for native-tls, and fonts for the GUI tests.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libssl-dev pkg-config fonts-dejavu-core fonts-noto-core
      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --all-features --lib --lcov --output-path target/lcov.info
          {
            echo "### Line coverage"
            echo
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: target/lcov.info
          retention-days: 30
