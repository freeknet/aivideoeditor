# cargo-deny: `cargo deny check`. CI runs this on every push.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "warn"
ignore = [
    # zbus's zvariant / zvariant_derive / zbus_names, marked unmaintained.
    # Reached only through rfd -> ashpd (the Linux XDG file-dialog portal);
    # unused on Windows, where the app ships. Clears when rfd/ashpd move to
    # a maintained D-Bus crate, or when we drop rfd's portal backend.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via rfd/ashpd, Linux portal only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via rfd/ashpd, Linux portal only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via rfd/ashpd, Linux portal only" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    # Fonts. egui's bundled faces come in under these; the app also ships
    # Inter (assets/fonts/Inter-Regular.ttf, OFL-1.1, licence text in
    # assets/fonts/OFL.txt) as its UI face. Not a crate, so cargo-deny does
    # not see it; this note is the record that its licence was checked.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # webpki-roots ships the Mozilla CA bundle as data under CDLA-Permissive-2.0
    # (pulled in by ureq for HTTPS to the assistant API); permissive, data only.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Our own crates are unpublished; their licence is ours to state, not cargo-deny's to check.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
