# cargo-deny: `cargo deny check`. CI runs this on every push.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "warn"
ignore = [
    # Unmaintained crates that egui-material3 pulls in unconditionally. None
    # is a known vulnerability; each clears when the fork puts its parent
    # behind an off-by-default feature (ave never asks the OS for its theme
    # and draws no SVG through the library).
    #
    # dark-light (OS light/dark detection) -> async-std, pin-utils, and on
    # Linux zbus's zbus_names / zvariant / zvariant_derive.
    { id = "RUSTSEC-2025-0052", reason = "async-std via egui-material3's dark-light; clears when dark-light is optional in the fork" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils via egui-material3's dark-light; clears when dark-light is optional in the fork" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via egui-material3's dark-light; clears when dark-light is optional in the fork" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via egui-material3's dark-light; clears when dark-light is optional in the fork" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via egui-material3's dark-light; clears when dark-light is optional in the fork" },
    # resvg (SVG icons) -> rustybuzz, ttf-parser.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via egui-material3's resvg; clears when resvg is optional in the fork or moves off rustybuzz" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via egui-material3's resvg; clears when resvg is optional in the fork or moves off ttf-parser" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    # Fonts. egui's bundled faces come in under these. The app also compiles
    # in Mona Sans, Roboto Mono and Inter (OFL-1.1) and the Lucide icon font
    # (ISC, Feather-derived glyphs MIT). They are not crates, so cargo-deny
    # does not see them; assets/fonts/NOTICE records each one's source and
    # licence, and the licence texts ship beside the fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # webpki-roots ships the Mozilla CA bundle as data under CDLA-Permissive-2.0
    # (pulled in by ureq for HTTPS to the assistant API); permissive, data only.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Our own crates are unpublished; their licence is ours to state, not cargo-deny's to check.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The desktop editor's Material 3 widgets come from the maintainer's own fork of
# egui-material3, which carries fixes (M3 tokens, state layers, AccessKit roles)
# not yet merged upstream. Cargo.toml pins it to a full commit.
allow-git = ["https://github.com/freeknet/egui-material3"]
