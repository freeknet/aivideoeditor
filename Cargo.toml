[package]
name = "aivideoeditor"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Index footage, plan beat-synced edits, render and export timelines."
authors = ["Lawrence Norton"]
license = "MIT"
repository = "https://github.com/freeknet/aivideoeditor"
readme = "README.md"
publish = false

[[bin]]
name = "ave"
path = "src/main.rs"

# The changelog, credits and package tools carry unit tests for their
# parsers; an example's tests only run under `cargo test` when it opts in.
[[example]]
name = "changelog"
test = true

[[example]]
name = "credits"
test = true

[[example]]
name = "package"
test = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
# Material 3 tokens and widgets for the desktop editor: the maintainer's fork,
# pinned to a full commit (deny.toml allows the source).
egui-material3 = { git = "https://github.com/freeknet/egui-material3", rev = "a5121db271281d645f6f8768391490ba7c462ec5" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.2"
base64 = "0.23"
cpal = "0.18"
crossbeam-channel = "0.5"
# RUST_LOG's directive syntax, without env_logger's formatting and
# terminal stack: the logger in src/logging.rs writes its own lines.
env_filter = { version = "2", default-features = false, features = ["std"] }
rayon = "1"
rfd = "0.18"
rustfft = "6"
serde_json = "1"
# native-tls: Schannel on Windows, so no C crypto build (ring) in the
# shipped binary or the Windows cross-check.
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls"] }

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
# Property tests for the parsers of outside input (people.toml keys,
# recipe.toml, plan files, MCP messages). `std` only: no forking runner and
# no per-case timeouts, which the default features add.
proptest = { version = "1", default-features = false, features = ["std"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
warnings = "deny"
dead_code = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
non_camel_case_types = "deny"
unused_variables = "deny"
unused_imports = "forbid"
unused_must_use = "forbid"
unreachable_patterns = "forbid"
unreachable_pub = "forbid"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
# Unsafe Rust is denied everywhere; `src/win/` is the one module allowed it,
# and says so with `#[expect(unsafe_code)]` on its `mod` line in lib.rs.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
match_wild_err_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
ignored_unit_patterns = "deny"
allow_attributes = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A crash is only as useful as its symbols. `line-tables-only` is enough
# for function names and file:line in a backtrace or a WinDbg stack, at a
# small cost in size. `strip = "debuginfo"` would make rustc pass
# /DEBUG:NONE to the MSVC linker, which writes no PDB at all, so stripping
# is off. On Windows the symbols live in a separate .pdb that is not loaded
# at runtime and does not change ave.exe; the release ships it as its own
# `-symbols` archive.
debug = "line-tables-only"
strip = "none"
panic = "abort"

# Optimised but quick to rebuild: `cargo run --profile release-fast`.
[profile.release-fast]
inherits = "release"
lto = false
incremental = true
codegen-units = 16

[profile.release-fast.package.aivideoeditor]
codegen-units = 256

[profile.dev.package."*"]
debug = "line-tables-only"
